    <!DOCTYPE html>
    <html lang="id">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu</title>
    <style>
      body { margin:0; background:linear-gradient(#000428, #004e92); color:#fff; font-family:'Georgia',serif; display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; padding:20px; }
      canvas { position:fixed; top:0; left:0; z-index:-1; }
      .card { text-align:center; padding:30px; max-width:650px; background:rgba(0,0,0,0.5); border-radius:20px; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); }
      #musicBtn { position: fixed; top: 20px; right: 20px; z-index: 999; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,179,198,0.9); border: none; font-size: 24px; cursor: pointer; box-shadow: 0 0 15px #ffb3c6; }
      #musicBtn.playing { animation: pulse 1.5s infinite; }
      @keyframes pulse { 0%,100%{box-shadow:0 0 15px #ffb3c6} 50%{box-shadow:0 0 30px #ffb3c6} }
      #btn { padding:15px 30px; background:#ffb3c6; border:none; border-radius:15px; font-size:18px; cursor:pointer; color:#0a0a1a; font-weight:bold; }
      #surat { display:none; text-align:left; line-height:2; font-size:17px; white-space:pre-line; margin-top:20px; }
      .line { opacity:0; animation: fadeIn 1.2s forwards; }
      @keyframes fadeIn { to { opacity:1; } }
    </style>
    </head>
    <body>
    <canvas id="stars"></canvas>
    <button id="musicBtn">🎵</button>
    <div class="card">
      <button id="btn">Buka Surat 💌</button>
      <div id="surat"></div>
      <p style="font-size:12px; opacity:0.6; margin-top:20px;">A Thousand Years - Piano Cover</p>
    </div>
    <audio id="audio" loop src="lagu.mp3"></audio>
    <script>
    const teks = `emm gimana kabar kamu hari ini? udah sekitar 2 bulan ya ga komunikasi ,kenapa ya aku udah usaha buat lupain kamu dengan cara apapun tapi ga bisa, apa gara first experience nya di kamu yah, sumpah aku udah usaha gmn pun tapi tetep aja klo malem mikirin kamu, maaf ya aku ganggu hidup kamu lagi, aku tau kamu udah move on dari aku, tapi aku selalu kangen sm kamu udah sekian aja, met malem maap ganggu malam nya cuma mau sampein itu aja.
    oh iya kalo kamu gabut chat aja aku tar aku temenin, yawes gitu aja sehat selalu ya orang pertamaku jan begadang terus ya...`;
    let isPlaying = false;
    document.getElementById('btn').onclick = () => {
      document.getElementById('btn').style.display='none';
      document.getElementById('surat').style.display='block';
      let lines = teks.split('\n');
      lines.forEach((l,i)=>{ setTimeout(()=>{ let p = document.createElement('div'); p.className='line'; p.textContent=l; document.getElementById('surat').appendChild(p); }, i*1600); });
    }
    document.getElementById('musicBtn').onclick = () => {
      const audio = document.getElementById('audio'); const btn = document.getElementById('musicBtn');
      if(!isPlaying){ audio.play(); btn.textContent = '🔊'; btn.classList.add('playing'); isPlaying = true; } 
      else { audio.pause(); btn.textContent = '🎵'; btn.classList.remove('playing'); isPlaying = false; }
    }
    const c = document.getElementById('stars'); const ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
    let stars = Array(150).fill().map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+1, s:Math.random()*0.8+0.3, alpha:Math.random()}));
    function anim(){ctx.clearRect(0,0,c.width,c.height); stars.forEach(s=>{ctx.beginPath();ctx.globalAlpha=s.alpha;ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fillStyle='white';ctx.fill();s.y+=s.s;if(s.y>c.height){s.y=0;s.x=Math.random()*c.width}});requestAnimationFrame(anim)} anim();
    </script>
    </body>
    </html>
